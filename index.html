<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Doggett Study</title>
<style>
  :root { --navy: #0b1f3a; --navy2: #0f2a4f; --red: #c8102e; --gold: #f5b942; --white: #fdfaf2; --chalk: #c9d6e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 60%, #081627 100%);
    color: var(--white); font: 17px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  h1 { font-size: clamp(28px, 8vw, 44px); margin: 0 0 6px; font-weight: 900; text-transform: uppercase;
    text-shadow: 0 2px 0 var(--red), 0 4px 14px rgba(0,0,0,.45); }
  .tagline { color: var(--chalk); font-style: italic; margin-bottom: 34px; }
  .cards { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  a.subject {
    display: block; width: 220px; padding: 28px 18px; border-radius: 16px; text-decoration: none; color: #fff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    font-weight: 800; text-transform: uppercase; letter-spacing: .03em; transition: transform .15s;
  }
  a.subject:active { transform: scale(.96); }
  a.subject .emoji { font-size: 34px; display: block; margin-bottom: 10px; }
  a.subject.spelling { background: rgba(255,143,171,.14); border-color: rgba(255,143,171,.35); }
</style>
</head>
<body>
  <h1>Doggett Study</h1>
  <div class="tagline">&ldquo;A&rsquo;s are made here.&rdquo;</div>
  <div class="cards">
    <a class="subject" href="/latin/"><span class="emoji">⚾</span>Latin</a>
    <a class="subject spelling" href="/spelling/"><span class="emoji">🩰</span>Spelling</a>
  </div>
<script src="/gate.js"></script>
</body>
</html>
